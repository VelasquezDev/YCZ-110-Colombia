# =============================================================================

[build]
  publish = "."

# Proxy inverso: Enruta las llamadas /api/* hacia tu Backend en Render
[[redirects]]
  from = "/api/*"
  to = "https://ycz-110-colombia.onrender.com/api/:splat"
  status = 200
  force = true

# Cabeceras de Ciberseguridad OWASP optimizadas para permitir SDKs externos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # CSP Actualizada: Autoriza scripts, iframes, pasarelas de pago y analíticas de MP
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://sdk.mercadopago.com https://cdn.jsdelivr.net https://http2.mlstatic.com; connect-src 'self' https://api.mercadopago.com https://api.mercadolibre.com https://api.emailjs.com; img-src 'self' https://images.unsplash.com data:; style-src 'self' 'unsafe-inline'; frame-src https://*.mercadopago.com https://*.mercadolibre.com;"