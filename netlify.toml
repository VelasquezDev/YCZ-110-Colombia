# =============================================================================
# PROYECTO: YCZ 110 Colombia
# ARCHIVO: netlify.toml (Configuración de Despliegue y Seguridad en el Edge)
# =============================================================================

[build]
  # Carpeta que contiene los activos estáticos del Frontend
  publish = "frontend"

# Proxy inverso: Enruta las llamadas /api/* hacia tu Backend o Netlify Function
# Esto evita problemas de terceros con cookies SameSite=Strict
[[redirects]]
  from = "/api/*"
  to = "https://api-ycz110-colombia.onrender.com/api/:splat"
  status = 200
  force = true

# Cabeceras de Ciberseguridad OWASP inyectadas directamente por el CDN de Netlify
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Content Security Policy (CSP): Autoriza únicamente scripts propios, Tailwind, MercadoPago y EmailJS
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://sdk.mercadopago.com https://cdn.jsdelivr.net; connect-src 'self' https://api.mercadopago.com https://api.emailjs.com; img-src 'self' https://images.unsplash.com data:; style-src 'self' 'unsafe-inline'; frame-src https://*.mercadopago.com;"